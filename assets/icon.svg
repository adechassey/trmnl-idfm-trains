<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Île-de-France Next Trains: front view of a suburban train, monochrome (e-ink friendly) -->
  <rect width="512" height="512" rx="112" fill="#000"/>
  <!-- roof bump -->
  <rect x="220" y="62" width="72" height="40" rx="14" fill="#fff"/>
  <!-- body -->
  <rect x="120" y="88" width="272" height="320" rx="64" fill="#fff"/>
  <!-- windshield -->
  <rect x="156" y="128" width="200" height="112" rx="28" fill="#000"/>
  <!-- headlights -->
  <circle cx="190" cy="326" r="26" fill="#000"/>
  <circle cx="322" cy="326" r="26" fill="#000"/>
  <!-- bumper -->
  <rect x="164" y="372" width="184" height="14" rx="7" fill="#000"/>
  <!-- bogies -->
  <rect x="150" y="416" width="72" height="26" rx="12" fill="#fff"/>
  <rect x="290" y="416" width="72" height="26" rx="12" fill="#fff"/>
  <!-- track -->
  <rect x="72" y="456" width="368" height="16" rx="8" fill="#fff"/>
</svg>
